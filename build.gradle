apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'war'

repositories {
    mavenCentral()
}

dependencies {
    providedCompile 'jakarta.platform:jakarta.jakartaee-web-api:11.0.0'
    implementation 'org.primefaces:primefaces:15.0.14:jakarta'
    testImplementation     'junit:junit:4.13'
}
// Source: https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
implementation group: 'com.mysql', name: 'mysql-connector-j', version: '9.7.0'

// Source: https://mvnrepository.com/artifact/org.eclipse.persistence/org.eclipse.persistence.jpa
implementation group: 'org.eclipse.persistence', name: 'org.eclipse.persistence.jpa', version: '4.0.8'