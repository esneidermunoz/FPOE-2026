apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'war'

repositories {
    mavenCentral()
}

dependencies {
    //
    testImplementation     'junit:junit:4.13'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:31.1-jre'

    // https://mvnrepository.com/artifact/jakarta.persistence/jakarta.persistence-api
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0-M2'

    // https://mvnrepository.com/artifact/org.eclipse.persistence/org.eclipse.persistence.jpa
    implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa:4.0.2'

    // https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
    implementation 'com.mysql:mysql-connector-j:8.4.0'


    // https://mvnrepository.com/artifact/jakarta.platform/jakarta.jakartaee-api
    providedCompile 'jakarta.platform:jakarta.jakartaee-web-api:11.0.0'
    // compileOnly 'jakarta.platform:jakarta.jakartaee-api:9.1.0'

    // https://mvnrepository.com/artifact/org.primefaces/primefaces
    implementation 'org.primefaces:primefaces:12.0.0:jakarta'

}
