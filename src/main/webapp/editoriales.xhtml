<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>#{label['xhtml.editoriales.label']}</title>
    </h:head>
    <h:body>

        <f:loadBundle var="label" basename="labels" />

        <h:form id="formEditoriales">
            <p:growl id="msjs" showDetail="false" />

            <p:card title="#{label['xhtml.editoriales.label']}"> 

                <h:panelGrid columns="3" >
                    <p:outputLabel value="#{label['editorial.nit.label']}" for="nit" /> 
                    <h:panelGrid columns="2">
                        <p:inputNumber id="nit" value="#{edctrl.editorial.nit}" decimalPlaces="0" emptyValue="0" />
                        <p:commandButton icon="pi pi-search" action="#{edctrl.buscarEditorial()}" update="@form" process="nit @this" />
                    </h:panelGrid>
                    <p:message for="nit" />

                    <p:outputLabel value="#{label['editorial.nombre.label']}" for="nombre" /> 
                    <p:inputText id="nombre" value="#{edctrl.editorial.nombre}" required="true" requiredMessage="El nombre es obligatorio" />
                    <p:message for="nombre" />

                </h:panelGrid>

                <f:facet name="footer"> 
                    <p:commandButton value="#{label['accion.guardar.label']}" 
                                     action="#{edctrl.guardar()}" 
                                     icon="pi pi-save" 
                                     update="@form tablaEditoriales" />
                    <p:spacer width="5" />
                    <p:commandButton value="#{label['accion.borrar.label']}" 
                                     action="#{edctrl.cancelar()}" 
                                     icon="pi pi-times" 
                                     update="@form"
                                     process="@this" />
                </f:facet>
            </p:card>

            <p:spacer height="20" />

            <p:dataTable id="tablaEditoriales" value="#{edctrl.editoriales}" var="publi" emptyMessage="No hay editoriales registradas">
                <p:column headerText="#{label['editorial.nit.label']}">
                    <h:outputText value="#{publi.nit}" />
                </p:column>
                <p:column headerText="#{label['editorial.nombre.label']}">
                    <h:outputText value="#{publi.nombre}" />
                </p:column>
            </p:dataTable>
            
        </h:form>

    </h:body>
</html>
