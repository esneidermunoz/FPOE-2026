<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <head>
        <title>TODO supply a title</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </head>

    <h:body>
        <h:form>
            <p:card style="width: 35rem; margin-bottom: 2em">
                <f:facet name="title">Gestionar Asignaturas</f:facet>

                <h:panelGrid columns="3">

                    <p:outputLabel for="txtCodigo" value="Código : " />
                    <p:inputText id="txtCodigo" value="#{asignCtrl.asignatura.codigo}"></p:inputText>
                    <p:message for="txtCodigo"></p:message>

                    <p:outputLabel for="txtNombre" value="Nombre : " />
                    <p:inputText id="txtNombre"value="#{asignCtrl.asignatura.nombre}"></p:inputText>
                    <p:message for="txNombre"></p:message>

                    <p:outputLabel for="txtCreditos" value="Créditos : " />
                    <p:inputNumber id="txtCreditos"value="#{asignCtrl.asignatura.creditos}"></p:inputNumber>
                    <p:message for="txtCreditos"></p:message>

                    <p:outputLabel for="txtIntensidad" value="Intensidad : " />
                    <p:inputNumber id="txtIntensidad"value="#{asignCtrl.asignatura.intensidad}"></p:inputNumber>
                    <p:message for="txtIntensidad"></p:message>

                </h:panelGrid>

                <f:facet name="footer">
                    <p:commandButton icon="pi pi-check" value="Save"/>
                    <p:commandButton icon="pi pi-times" value="Cancel"
                                     styleClass="ui-button-secondary"
                                     style="margin-left: .5em"/>
                </f:facet>
            </p:card>
        </h:form>
    </h:body>
</html>
